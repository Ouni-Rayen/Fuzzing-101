<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEC Club</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap');

        :root {
            --navy: #070b1a;
            --deep-navy: #0a0e27;
            --cyan: #00e5ff;
            --cyan-glow: #00f0ff;
            --lavender: #e8e0ff;
            --white: #f5f3ff;
            --muted: #8a8fa8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at center, #0d1230 0%, var(--navy) 70%);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 229, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(232, 224, 255, 0.05) 0%, transparent 40%);
            pointer-events: none;
        }

        .container {
            text-align: center;
            max-width: 720px;
            padding: 2rem;
            z-index: 1;
        }

        .logo-placeholder {
            width: 140px;
            height: 140px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.15), rgba(232, 224, 255, 0.1));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.3),
                        0 0 80px rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.3);
            position: relative;
        }

        .logo-placeholder::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--cyan), transparent, var(--lavender));
            opacity: 0.4;
            z-index: -1;
            filter: blur(8px);
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--cyan);
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, var(--white), var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            color: var(--cyan);
            font-size: 1.1rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
            opacity: 0.9;
        }

        .card {
            background: rgba(10, 14, 39, 0.7);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .card p {
            color: var(--lavender);
            line-height: 1.7;
            margin-bottom: 1.2rem;
            font-size: 1.05rem;
        }

        .card p:last-child {
            margin-bottom: 0;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .accent {
            color: var(--cyan);
            font-weight: 600;
        }

        footer {
            position: absolute;
            bottom: 1.5rem;
            color: var(--muted);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        footer a {
            color: var(--cyan);
            text-decoration: none;
            opacity: 0.8;
        }

        footer a:hover {
            opacity: 1;
            text-shadow: 0 0 8px var(--cyan);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-placeholder">
            <img src="logo.jpg" alt="SecuriNets Logo" class="logo-img">
        </div>
        <h1>SecuriNets</h1>
        <p class="tagline">Where the fun never fades</p>
    </div>

    <footer>
        SecuriNets freindly CTF
    </footer>
</body>
</html>
